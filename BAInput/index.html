<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpalOps BA Input</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#0B1220;--panel:#121B2E;--panel2:#162033;--line:#24324d;--fg:#F4F1EA;--muted:#A9B4C6;--gold:#D4A84B;--ink:#1a1405;--bad:#E58B7B;--ok:#7FC8A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,Arial,sans-serif;padding:0 16px 60px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:42px}
header h1{font:700 21px 'Space Grotesk',Arial,sans-serif;margin:0}
header .sp{flex:1}
h2{font:700 24px 'Space Grotesk',Arial,sans-serif;margin:24px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.btn{background:var(--gold);color:var(--ink);border:0;font:600 14px Inter,Arial,sans-serif;padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;color:inherit;padding:0;cursor:pointer;font:inherit}
.card:hover{border-color:var(--gold)}
.ph{aspect-ratio:4/5;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.ph img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px 12px 12px;display:grid;gap:2px}
.nm{font:600 16px 'Space Grotesk',Arial,sans-serif}
.sz{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tag.Pending{color:var(--gold)}.tag.Approved{color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px 20px;color:var(--muted);text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:13px}
.panel h3{font:700 18px 'Space Grotesk',Arial,sans-serif;margin:0}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=password],textarea,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:15px Inter,Arial,sans-serif;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.up{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center}
.thumb{width:60px;height:76px;background:var(--panel2);border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
input[type=file]{font-size:13px;color:var(--muted);max-width:100%}
.chip{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:12.5px}
a{color:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--gold);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;z-index:9}
#toast.err{background:var(--bad)}
.login{max-width:380px;margin:12vh auto;text-align:center;display:grid;gap:14px}
.login img{height:70px;margin:0 auto}
[hidden]{display:none!important}
</style>
</head>

    <h1>Brand Ambassador Input</h1>
    <span class="sp"></span>
    <button class="btn ghost" id="out">Lock</button>
  </header>
  <h2>Roster</h2>
  <p class="sub">Add each ambassador once. Photos and the resume go to their own Drive folder, and the details go to the roster sheet. Select a card to edit.</p>
  <div class="split">
    <div>
      <div class="row" style="margin-bottom:14px"><button class="btn" id="add">Add ambassador</button><span class="note" id="count"></span></div>
      <div id="roster" class="grid"></div>
    </div>
    <form id="form" class="panel" hidden autocomplete="off">
      <h3 id="ftitle">New ambassador</h3>
      <label for="enteredBy">Your name (who is entering this)<input type="text" id="enteredBy" required></label>
      <div class="f2">
        <label for="First">First name<input type="text" id="First" required></label>
        <label for="Last">Last name<input type="text" id="Last"></label>
      </div>
      <div class="f2">
        <label for="Phone">Phone<input type="tel" id="Phone"></label>
        <label for="Email">Email<input type="email" id="Email"></label>
      </div>
      <div class="cap">Sizes</div>
      <div class="f3">
        <label for="Height">Height<input type="text" id="Height" placeholder="5'9&quot;"></label>
        <label for="Shirt">Shirt<input type="text" id="Shirt"></label>
        <label for="Dress">Dress<input type="text" id="Dress"></label>
        <label for="Jacket">Jacket<input type="text" id="Jacket"></label>
        <label for="Pants">Pants<input type="text" id="Pants"></label>
        <label for="Shoe">Shoe<input type="text" id="Shoe"></label>
      </div>
      <label for="Languages">Languages<input type="text" id="Languages" placeholder="English, Spanish"></label>
      <label for="Bio">Bio (2 or 3 sentences, shown to clients)<textarea id="Bio"></textarea></label>
      <div class="cap">Photos and resume</div>
      <div class="up"><div class="thumb" id="t-head">None</div><label for="headshot">Headshot<input type="file" id="headshot" accept="image/png,image/jpeg,image/webp"></label></div>
      <div class="up"><div class="thumb" id="t-p2">None</div><label for="photo2">Second photo<input type="file" id="photo2" accept="image/png,image/jpeg,image/webp"></label></div>
      <div class="up"><div class="thumb" id="t-res">None</div><label for="resume">Resume (PDF)<input type="file" id="resume" accept="application/pdf"></label></div>
      <label class="chip" for="PhotoConsent"><input type="checkbox" id="PhotoConsent"> Photo-use consent on file</label>
      <label for="Status">Status<select id="Status"><option>Pending</option><option>Approved</option></select></label>
      <p class="note" id="folderLink" hidden></p>
      <div class="row">
        <button class="btn" type="submit" id="save">Save</button>
        <button class="btn ghost" type="button" id="cancel">Cancel</button>
        <button class="btn bad" type="button" id="arch" hidden>Archive</button>
      </div>
    </form>
  </div>
</div>
</div>
<div id="toast" hidden></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var PASS='',list=[],cur=null;
  var FIELDS=['First','Last','Phone','Email','Height','Shirt','Dress','Jacket','Pants','Shoe','Languages','Bio'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(m,err){var t=$('#toast');t.textContent=m;t.className=err?'err':'';t.hidden=false;clearTimeout(say.t);say.t=setTimeout(function(){t.hidden=true},err?5000:2200)}
  function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)})[fn].apply(null,[PASS].concat(a))})}
  function msg(e){return (e&&e.message||String(e)).replace(/^Error:\s*/,'')}

  function enter(){
    run('api_check').then(function(){
      try{sessionStorage.setItem('baPass',PASS)}catch(e){}
      $('#login').hidden=true;$('#app').hidden=false;load();
    }).catch(function(e){$('#lerr').hidden=false;$('#lerr').textContent=/passcode/i.test(msg(e))?'That passcode did not work.':'Could not connect: '+msg(e);$('#go').disabled=false});
  }
  $('#go').onclick=function(){PASS=$('#pass').value;$('#go').disabled=true;enter()};
  $('#pass').addEventListener('keydown',function(e){if(e.key==='Enter')$('#go').click()});
  $('#out').onclick=function(){try{sessionStorage.removeItem('baPass')}catch(e){}location.reload()};
  try{var s=sessionStorage.getItem('baPass');if(s){PASS=s;enter()}}catch(e){}

  function load(){
    run('api_list').then(function(r){list=r;draw()}).catch(function(e){say(msg(e),true)});
  }
  function sizeLine(a){var p=[];['Height','Shirt','Pants','Shoe'].forEach(function(k){if(a[k])p.push(k+' '+a[k])});return p.join(' · ')}
  function draw(){
    $('#count').textContent=list.length?list.length+(list.length===1?' ambassador':' ambassadors'):'';
    if(!list.length){$('#roster').className='';$('#roster').innerHTML='<div class="empty"><strong style="display:block;color:#F4F1EA">No ambassadors yet</strong>Select Add ambassador to enter the first one.</div>';return}
    $('#roster').className='grid';
    $('#roster').innerHTML=list.map(function(a,i){
      return '<button class="card" data-i="'+i+'"><div class="ph">'+(a.thumb?'<img alt="" src="'+a.thumb+'">':'No photo')+'</div><div class="meta"><span class="nm">'+esc(a.First)+' '+esc(String(a.Last||'').charAt(0))+'</span><span class="sz">'+esc(sizeLine(a)||'No sizes yet')+'</span><span class="tag '+esc(a.Status)+'">'+esc(a.Status)+'</span></div></button>';
    }).join('');
    document.querySelectorAll('.card').forEach(function(b){b.onclick=function(){open_(list[+b.dataset.i])}});
  }
  function thumbSet(el,src,txt){el.innerHTML=src?'<img alt="" src="'+src+'">':txt}
  function open_(a){
    cur=a||null;a=a||{};
    $('#ftitle').textContent=cur?'Edit '+(a.First||''):'New ambassador';
    FIELDS.forEach(function(k){$('#'+k).value=a[k]||''});
    try{$('#enteredBy').value=localStorage.getItem('baName')||a.EnteredBy||''}catch(e){$('#enteredBy').value=a.EnteredBy||''}
    $('#PhotoConsent').checked=a.PhotoConsent==='Yes';$('#Status').value=a.Status||'Pending';
    ['headshot','photo2','resume'].forEach(function(k){$('#'+k).value=''});
    thumbSet($('#t-head'),a.thumb,'None');thumbSet($('#t-p2'),'','None');$('#t-res').textContent=a.ResumeId?'On file':'None';
    if(cur&&a.FolderUrl){$('#folderLink').hidden=false;$('#folderLink').innerHTML='<a target="_blank" href="'+esc(a.FolderUrl)+'">Open Drive folder</a>'}else $('#folderLink').hidden=true;
    $('#arch').hidden=!cur;$('#arch').textContent='Archive';
    $('#form').hidden=false;$('#First').focus();
  }
  $('#add').onclick=function(){open_(null)};
  $('#cancel').onclick=function(){$('#form').hidden=true;cur=null};
  [['headshot','#t-head'],['photo2','#t-p2']].forEach(function(p){$('#'+p[0]).onchange=function(){var f=this.files[0];if(f)thumbSet($(p[1]),URL.createObjectURL(f),'')}});
  $('#resume').onchange=function(){if(this.files[0])$('#t-res').textContent='Ready'};

  function toB64(file,isImg){
    return new Promise(function(res,rej){
      if(!isImg){var r=new FileReader();r.onload=function(){res({name:file.name,mime:file.type||'application/pdf',b64:String(r.result).split(',')[1]})};r.onerror=rej;r.readAsDataURL(file);return}
      createImageBitmap(file).then(function(bmp){
        var sc=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
        c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
        res({name:file.name,mime:'image/jpeg',b64:c.toDataURL('image/jpeg',0.85).split(',')[1]});
      }).catch(function(){rej(new Error('Could not read that photo. Use a JPG or PNG.'))});
    });
  }
  $('#form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var btn=$('#save');btn.disabled=true;btn.textContent='Saving…';
    var rec={ID:cur?cur.ID:'',PhotoConsent:$('#PhotoConsent').checked,Status:$('#Status').value,EnteredBy:$('#enteredBy').value};
    FIELDS.forEach(function(k){rec[k]=$('#'+k).value});
    try{localStorage.setItem('baName',rec.EnteredBy)}catch(e){}
    var files={},jobs=[];
    [['headshot',true],['photo2',true],['resume',false]].forEach(function(j){var f=$('#'+j[0]).files[0];if(f)jobs.push(toB64(f,j[1]).then(function(o){files[j[0]]=o}))});
    Promise.all(jobs).then(function(){return run('api_save',rec,files)}).then(function(){
      $('#form').hidden=true;cur=null;say('Saved to Drive and the roster');load();
    }).catch(function(e){say(msg(e),true)}).then(function(){btn.disabled=false;btn.textContent='Save'});
  });
  $('#arch').onclick=function(){
    if($('#arch').textContent==='Archive'){$('#arch').textContent='Select again to confirm';return}
    run('api_archive',cur.ID).then(function(){$('#form').hidden=true;cur=null;say('Archived (files stay in Drive)');load()}).catch(function(e){say(msg(e),true)});
  };
})();
</script>
</body>
</html>
